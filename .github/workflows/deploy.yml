name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hugo needs full history for .Lastmod from git

      - name: Install Hugo
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - uses: actions/configure-pages@v5

      # IMPORTANT: do NOT pass --baseURL here.
      #
      # The stock Hugo starter workflow injects
      #   --baseURL "${{ steps.pages.outputs.base_url }}"
      # which would be https://<user>.github.io/blog/. That leaks github.io into
      # every canonical tag, cover image and feed URL. The real public origin is
      # clicknow.ai, and it is hardcoded in hugo.toml on purpose.
      - name: Build
        run: hugo --gc --minify

      # Gate the deploy on the migration contract: every original Blogmaker
      # URL must still resolve, asset paths must keep the /blog prefix, and
      # feed entry ids must stay byte-identical. Cheaper to fail here than to
      # discover a silent 404 in Search Console weeks later.
      - name: Verify build
        run: |
          pip install --quiet beautifulsoup4
          python3 tools/verify_build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
